<svg viewBox="0 0 100 100" width="100" height="100" xmlns="http://www.w3.org/2000/svg" style="background: transparent;">
  <!-- Wheel / Glowing Orbit (মায়াবৃত্ত) -->
  <g transform="translate(50, 50)">
    <!-- Outer Orbit Circle -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#E63946" stroke-width="2.5" stroke-dasharray="8 4" opacity="0.7"/>
    <circle cx="0" cy="0" r="38" fill="#140817" stroke="#FF758F" stroke-width="2"/>

    <!-- Couple Embrace in the Core (যুগল আলিঙ্গন) -->
    <path d="M -15,-10 C -25,-25 -5,-30 0,-15 C 5,-30 25,-25 15,-10 C 5,5 0,18 0,22 C 0,18 -5,5 -15,-10 Z" fill="#E63946" opacity="0.9"/>
    <circle cx="-6" cy="-12" r="3.5" fill="#FFE3E8"/>
    <circle cx="6" cy="-12" r="3.5" fill="#FFE3E8"/>
    
    <!-- Sparkles -->
    <circle cx="28" cy="-28" r="2.5" fill="#FF758F"/>
    <circle cx="-28" cy="28" r="2" fill="#FF758F"/>
  </g>
</svg>